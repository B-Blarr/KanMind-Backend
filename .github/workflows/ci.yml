name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Checks the pinned packages against the public vulnerability databases.
  # The pins are exact, so no install and no resolving is needed.
  audit:
    name: pip-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit requirements
        run: pip-audit -r requirements.txt --no-deps --disable-pip

  test:
    name: Django tests
    runs-on: ubuntu-latest

    env:
      # Throwaway value for the test run. Not a secret, and used nowhere else.
      SECRET_KEY: ci-only-key-not-used-outside-this-workflow

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # --check exits non-zero on a forgotten migration, --dry-run writes nothing.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
